<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Театральный wishlist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F8F6F3;--card:#fff;--ink:#1A1816;--muted:#6c6862;--soft:#ece7e1;--wine:#651832;--wine2:#8e2343;--blue:#2c5276;--gray:#697580;--bd:rgba(0,0,0,.1);--ser:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}.page{max-width:980px;margin:0 auto;padding:28px 18px 60px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.title{font-family:var(--ser);font-size:44px;line-height:1;margin:0}.sub{font-size:13px;color:#9b968f;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn,.chip{border:.5px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none}.btn.primary,.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}.btn.pink{background:rgba(142,35,67,.08);color:var(--wine2);border-color:rgba(142,35,67,.18)}.filters{display:grid;gap:8px;margin:20px 0}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#aaa;min-width:52px}.chip{border-radius:999px;padding:5px 11px;font-size:12px;min-width:72px}.heart-filter{min-width:42px;font-size:17px;line-height:1;padding:6px 11px}.heart-filter.on{background:var(--card);border-color:currentColor;box-shadow:0 0 0 1px currentColor inset}.search{width:100%;border:.5px solid var(--bd);border-radius:10px;background:var(--card);padding:11px 13px;font:inherit;color:var(--ink);margin-bottom:20px}.section{margin:24px 0}.section h2{font-family:var(--ser);font-size:24px;font-weight:400;border-bottom:.5px solid var(--bd);padding-bottom:8px;margin:0 0 12px}.count{font-family:var(--sans);font-size:12px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}.card{background:var(--card);border:.5px solid var(--bd);border-left:4px solid var(--blue);border-radius:13px;min-height:185px;display:flex;flex-direction:column;overflow:hidden}.card[data-status=verywant]{border-left-color:var(--wine)}.card[data-status=bought]{border-left-color:var(--wine2)}.card[data-status=seen]{border-left-color:var(--wine)}.card[data-status=postponed]{border-left-color:var(--gray)}.body{padding:16px 16px 10px;flex:1}.top{display:flex;justify-content:space-between;gap:10px}.name{font-family:var(--ser);font-size:22px;font-weight:600;line-height:1.05}.pill{font-size:11px;white-space:nowrap;border-radius:999px;padding:4px 9px;background:rgba(44,82,118,.1);color:var(--blue);height:max-content}.meta{font-size:12px;color:var(--muted);margin:8px 0}.source{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#aaa;margin-bottom:8px}.note,.review{font-size:12px;color:var(--muted);font-style:italic}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{font-size:10px;border-radius:999px;background:rgba(142,35,67,.08);color:var(--wine2);padding:2px 7px}.foot{border-top:.5px solid var(--bd);padding:9px 16px;display:flex;gap:7px;flex-wrap:wrap}.link{font-size:11px;text-decoration:none;border:.5px solid rgba(44,82,118,.2);background:rgba(44,82,118,.08);color:var(--blue);border-radius:7px;padding:5px 9px}.small{font-size:11px;border:.5px solid var(--bd);background:transparent;border-radius:7px;padding:5px 9px;color:var(--muted);cursor:pointer}.heart{font-size:20px;margin-bottom:5px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.open{display:flex}.modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto}.mh{padding:18px 20px;border-bottom:.5px solid var(--bd);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card)}.mh h3{font-family:var(--ser);font-size:26px;font-weight:400;margin:0}.mb{padding:18px 20px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin-bottom:5px}.inp,.sel,.txt{width:100%;border:.5px solid var(--bd);border-radius:9px;background:var(--bg);padding:9px 11px;font:inherit;color:var(--ink)}.txt{min-height:74px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hearts{display:flex;gap:8px}.heartbtn{width:36px;height:36px;border:.5px solid var(--bd);border-radius:9px;background:var(--card);font-size:22px;cursor:pointer}.heartbtn.on{outline:2px solid currentColor}.savebar{display:flex;justify-content:flex-end;gap:9px;border-top:.5px solid var(--bd);padding-top:14px}.status{font-size:12px;color:#aaa;margin-top:8px}.err{color:#b03030}.ok{color:var(--blue)}
@media(max-width:640px){.hero{display:block}.actions{justify-content:flex-start;margin-top:12px}.title{font-size:34px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body class="readonly">
<div class="page">
  <div class="hero"><div><h1 class="title">Театральный wishlist</h1><div class="sub">Личная доска спектаклей — хочу, куплено, смотрела · Telegram: @solosvet</div></div><div class="actions"><button class="btn" id="loginBtn">Войти</button><button class="btn pink edit hidden" id="addBtn">+ Добавить</button><button class="btn pink" id="theatresBtn">Сайты театров</button></div></div>
  <div class="filters" id="filters">
    <div class="row"><span class="label">Раздел</span><button class="chip on" data-view="wishlist">Wishlist</button><button class="chip" data-view="seen">Смотрела</button></div>
    <div class="row"><span class="label">Тип</span><button class="chip on" data-cat="all">Все</button><button class="chip" data-cat="adult">Взрослые</button><button class="chip" data-cat="kids">Детские</button></div>
    <div class="row"><span class="label">Город</span><button class="chip on" data-city="all">Все</button><button class="chip" data-city="Москва">Москва</button><button class="chip" data-city="Санкт-Петербург">Санкт-Петербург</button></div>
    <div class="row" id="strow"><span class="label">Статус</span><button class="chip on" data-st="all">Все</button><button class="chip" data-st="bought">Куплено</button><button class="chip" data-st="verywant">Очень хочу</button><button class="chip" data-st="want">Хочу</button><button class="chip" data-st="postponed">Отложено</button></div>
    <div class="row" id="heartrow" style="display:none"><span class="label">Сердце</span><button class="chip on" data-heart="all">Все</button><button class="chip heart-filter" data-heart="#B32035" style="color:#B32035" title="Красное">♥</button><button class="chip heart-filter" data-heart="#D86B8C" style="color:#D86B8C" title="Розовое">♥</button><button class="chip heart-filter" data-heart="#D8782D" style="color:#D8782D" title="Оранжевое">♥</button><button class="chip heart-filter" data-heart="#8B8782" style="color:#8B8782" title="Серое">♥</button></div>
    <div class="row"><span class="label">Теги</span><button class="chip on" data-tag="all">Все</button><button class="chip" data-tag="#подростки">#подростки</button><button class="chip" data-tag="#NY">#NY</button><button class="chip" data-tag="#неуловимый">#неуловимый</button><button class="chip" data-tag="#$$$">#$$$</button><button class="chip" data-tag="#улица">#улица</button></div>
  </div>
  <input class="search" id="search" placeholder="Название, театр, режиссёр, тег...">
  <div id="status" class="status">Загружаю данные...</div>
  <section id="theatres" class="section hidden"><h2>Сайты театров <span class="count" id="tcnt"></span></h2><div class="grid" id="theatreGrid"></div></section>
  <section id="adultSec" class="section"><h2>Взрослые спектакли <span class="count" id="adultCnt"></span></h2><div class="grid" id="adultGrid"></div></section>
  <section id="kidsSec" class="section"><h2>Детские спектакли <span class="count" id="kidsCnt"></span></h2><div class="grid" id="kidsGrid"></div></section>
</div>
<div class="overlay" id="pin"><div class="modal"><div class="mh"><h3>Вход</h3><button class="small" onclick="pin.classList.remove('open')">×</button></div><div class="mb"><div class="field"><label>PIN</label><input class="inp" id="pinInput" type="password"></div><div class="savebar"><button class="btn primary" onclick="enterPin()">Войти</button></div></div></div></div>
<div class="overlay" id="modal"><div class="modal"><div class="mh"><h3 id="mtitle">Карточка</h3><button class="small" onclick="modal.classList.remove('open')">×</button></div><div class="mb"><input id="fid" type="hidden"><div class="field"><label>Название</label><input class="inp" id="f_title"></div><div class="two"><div class="field"><label>Театр</label><input class="inp" id="f_theater"></div><div class="field"><label>Режиссёр</label><input class="inp" id="f_director"></div></div><div class="two"><div class="field"><label>Категория</label><select class="sel" id="f_category"><option value="adult">Взрослый</option><option value="kids">Детский</option></select></div><div class="field"><label>Город</label><select class="sel" id="f_city"><option>Москва</option><option>Санкт-Петербург</option></select></div></div><div class="two"><div class="field"><label>Статус</label><select class="sel" id="f_status"><option value="want">Хочу</option><option value="verywant">Очень хочу</option><option value="bought">Куплено</option><option value="seen">Смотрела</option><option value="postponed">Отложено</option></select></div><div class="field"><label>Источник</label><input class="inp" id="f_source"></div></div><div class="field"><label>Ссылка</label><input class="inp" id="f_link"></div><div class="field"><label>Хэштеги</label><input class="inp" id="f_tags" placeholder="#NY #подростки"></div><div class="two"><div class="field"><label>Дата билета</label><input class="inp" id="f_date" type="date"></div><div class="field"><label>Время</label><input class="inp" id="f_time"></div></div><div class="two"><div class="field"><label>С кем</label><input class="inp" id="f_companion"></div><div class="field"><label>Места</label><input class="inp" id="f_seat"></div></div><div class="field"><label>Дата просмотра</label><input class="inp" id="f_seen"></div><div class="field"><label>Сердце</label><div class="hearts"><button class="heartbtn" data-color="#B32035" style="color:#B32035">♥</button><button class="heartbtn" data-color="#D86B8C" style="color:#D86B8C">♥</button><button class="heartbtn" data-color="#D8782D" style="color:#D8782D">♥</button><button class="heartbtn" data-color="#8B8782" style="color:#8B8782">♥</button></div></div><div class="field"><label>Заметка</label><textarea class="txt" id="f_note"></textarea></div><div class="field"><label>Комментарий</label><textarea class="txt" id="f_review"></textarea></div><div class="savebar"><button class="btn" onclick="modal.classList.remove('open')">Отмена</button><button class="btn primary" onclick="saveCard()">Сохранить</button></div></div></div></div>
<script>
const CFG={url:'https://xvqcymdplylrfepveqsi.supabase.co',key:'sb_publishable_uzgbZiXHxqU-jES4eP57Yw_asGJzLGF'};
const statusEl=document.getElementById('status');
const filtersEl=document.getElementById('filters');
const theatresEl=document.getElementById('theatres');
const adultSecEl=document.getElementById('adultSec');
const kidsSecEl=document.getElementById('kidsSec');
const theatresBtnEl=document.getElementById('theatresBtn');
const db=window.supabase?.createClient ? window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}) : null;
let data=[],view='wishlist',cat='all',city='all',st='all',heart='all',tags=[],q='',edit=false,heartColor='#B32035',showTheatres=false;
const statuses={want:'Хочу',verywant:'Очень хочу',bought:'Куплено',seen:'Смотрела',postponed:'Отложено',tickets:'Хочу'};
const theatreSites=[['Театр на Таганке','Москва','https://tagankateatr.ru'],['Вахтангова','Москва','https://vakhtangov.ru'],['МХТ Чехова','Москва','https://mxat.ru'],['РАМТ','Москва','https://www.ramt.ru'],['МАМТ','Москва','https://stanmus.ru'],['Театриум','Москва','https://teatrium.ru'],['Мариинский театр','Санкт-Петербург','https://www.mariinsky.ru']];
function esc(s=''){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nt(x){return Array.isArray(x)?x:(typeof x==='string'?x.split(/[ ,]+/):[])}function norm(r){return{ id:r.id,title:r.title||'',theater:r.theater||'',director:r.director||'',source:r.source||'',city:r.city||'Москва',category:r.category==='kids'?'kids':'adult',status:r.status==='tickets'?'want':(r.status||'want'),dates:r.dates||'',note:r.note||'',review:r.review||'',companion:r.companion||'',seat:r.seat||'',date:r.performance_date||'',time:r.performance_time||'',seen:r.seen_date||'',heart:r.heart_color||'',link:r.link||'',order:r.display_order||0,tags:nt(r.data?.tags)}}
async function load(){try{statusEl.textContent='Загружаю Supabase...';let rows=[];if(db){const res=await db.from('performances').select('id,title,theater,director,source,city,category,status,dates,note,review,companion,seat,performance_date,performance_time,seen_date,heart_color,link,display_order,data').order('display_order',{ascending:true});if(res.error)throw res.error;rows=res.data||[]}else{const url=CFG.url+'/rest/v1/performances?select=id,title,theater,director,source,city,category,status,dates,note,review,companion,seat,performance_date,performance_time,seen_date,heart_color,link,display_order,data&order=display_order.asc';const res=await fetch(url,{headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key}});if(!res.ok)throw new Error(await res.text());rows=await res.json()}data=(rows||[]).map(norm);statusEl.textContent=`Загружено карточек: ${data.length}`;statusEl.className='status ok';render()}catch(e){statusEl.textContent='Не удалось загрузить Supabase: '+(e?.message||e);statusEl.className='status err';console.error(e)}}
function priority(c){return (c.city==='Санкт-Петербург'?100:0)+({bought:0,verywant:1,want:2,postponed:9,seen:20}[c.status]??5)}function seenKey(c){return c.seen||c.date||''}function filtered(){return data.filter(c=>{let ct=c.tags.map(x=>x.toLowerCase());return(view==='seen'?c.status==='seen':c.status!=='seen')&&(cat==='all'||c.category===cat)&&(city==='all'||c.city===city)&&(view==='seen'||(st==='all'?c.status!=='postponed':c.status===st))&&(view!=='seen'||heart==='all'||(c.heart||'#B32035').toLowerCase()===heart.toLowerCase())&&(tags.length===0||tags.some(t=>ct.includes(t.toLowerCase())))&&(!q||[c.title,c.theater,c.director,c.source,c.note,c.review,c.city,c.tags.join(' ')].join(' ').toLowerCase().includes(q.toLowerCase()))})}
function card(c){const action=(c.status==='seen'||c.status==='bought')?'Открыть спектакль':'Купить билет';return `<article class="card" data-status="${c.status}"><div class="body"><div class="top"><div class="name">${esc(c.title)}</div><span class="pill">${statuses[c.status]||c.status}</span></div><div class="meta">${esc(c.theater)}${c.director?' · '+esc(c.director):''}${c.city?' · '+esc(c.city):''}</div>${c.source?`<div class="source">от кого: ${esc(c.source)}</div>`:''}${c.status==='seen'?`<div class="heart" style="color:${esc(c.heart||'#B32035')}">♥</div>`:''}${c.tags.length?`<div class="tags">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}${c.note?`<div class="note">${esc(c.note)}</div>`:''}${c.review?`<div class="review">${esc(c.review)}</div>`:''}${c.status==='bought'?`<div class="meta">${esc(c.date)} ${esc(c.time)} ${c.companion?' · '+esc(c.companion):''} ${c.seat?' · '+esc(c.seat):''}</div>`:''}</div><div class="foot">${c.link?`<a class="link" target="_blank" href="${esc(c.link)}">${action}</a>`:''}${edit?`<button class="small" onclick="openEdit('${esc(c.id)}')">Редактировать</button><button class="small" onclick="delCard('${esc(c.id)}')">Удалить</button>`:''}</div></article>`}
function render(){filtersEl.classList.toggle('hidden',showTheatres);theatresEl.classList.toggle('hidden',!showTheatres);adultSecEl.classList.toggle('hidden',showTheatres||cat==='kids');kidsSecEl.classList.toggle('hidden',showTheatres||cat==='adult');theatresBtnEl.textContent=showTheatres?'К спектаклям':'Сайты театров';if(showTheatres){theatreGrid.innerHTML=theatreSites.map(t=>`<article class="card"><div class="body"><div class="name">${esc(t[0])}</div><div class="meta">${esc(t[1])}</div></div><div class="foot"><a class="link" target="_blank" href="${esc(t[2])}">Сайт</a></div></article>`).join('');tcnt.textContent=theatreSites.length;return}strow.style.display=view==='seen'?'none':'flex';heartrow.style.display=view==='seen'?'flex':'none';let arr=filtered().sort((a,b)=>view==='seen'?seenKey(b).localeCompare(seenKey(a),'ru'):(priority(a)-priority(b)||a.title.localeCompare(b.title,'ru')));let a=arr.filter(x=>x.category==='adult'),k=arr.filter(x=>x.category==='kids');adultGrid.innerHTML=a.map(card).join('');kidsGrid.innerHTML=k.map(card).join('');adultCnt.textContent=a.length||'';kidsCnt.textContent=k.length||'';}
function setGroup(sel,attr,val){document.querySelectorAll(sel).forEach(b=>b.classList.toggle('on',b.dataset[attr]===val))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;st='all';heart='all';tags=[];setGroup('[data-view]','view',view);setGroup('[data-st]','st','all');setGroup('[data-heart]','heart','all');syncTags();render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;setGroup('[data-cat]','cat',cat);render()});document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{city=b.dataset.city;setGroup('[data-city]','city',city);render()});document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{st=b.dataset.st;setGroup('[data-st]','st',st);render()});document.querySelectorAll('[data-heart]').forEach(b=>b.onclick=()=>{heart=b.dataset.heart;setGroup('[data-heart]','heart',heart);render()});function syncTags(){document.querySelectorAll('[data-tag]').forEach(b=>b.classList.toggle('on',b.dataset.tag==='all'?tags.length===0:tags.includes(b.dataset.tag)))}document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let t=b.dataset.tag;if(t==='all')tags=[];else tags=tags.includes(t)?tags.filter(x=>x!==t):[...tags,t];syncTags();render()});search.oninput=e=>{q=e.target.value;render()};theatresBtnEl.onclick=()=>{showTheatres=!showTheatres;render()};loginBtn.onclick=()=>pin.classList.add('open');function enterPin(){if(pinInput.value==='2702'){edit=true;document.body.classList.remove('readonly');document.querySelectorAll('.edit').forEach(x=>x.classList.remove('hidden'));loginBtn.textContent='Выйти';pin.classList.remove('open');render()}else alert('Неверный PIN')}addBtn.onclick=()=>openEdit();document.querySelectorAll('.heartbtn').forEach(b=>b.onclick=()=>{heartColor=b.dataset.color;document.querySelectorAll('.heartbtn').forEach(x=>x.classList.toggle('on',x.dataset.color===heartColor))});
function openEdit(id){let c=id?data.find(x=>x.id===id):{id:'',title:'',theater:'',director:'',source:'',city:'Москва',category:'adult',status:'want',link:'',tags:[],note:'',review:'',date:'',time:'',companion:'',seat:'',seen:'',heart:'#B32035'};fid.value=c.id||'';f_title.value=c.title;f_theater.value=c.theater;f_director.value=c.director;f_category.value=c.category;f_city.value=c.city;f_status.value=c.status;f_source.value=c.source;f_link.value=c.link;f_tags.value=c.tags.join(' ');f_date.value=c.date||'';f_time.value=c.time||'';f_companion.value=c.companion||'';f_seat.value=c.seat||'';f_seen.value=c.seen||'';f_note.value=c.note||'';f_review.value=c.review||'';heartColor=c.heart||'#B32035';document.querySelectorAll('.heartbtn').forEach(x=>x.classList.toggle('on',x.dataset.color===heartColor));modal.classList.add('open')}
async function saveCard(){let id=fid.value||('manual_'+Date.now());let row={id,title:f_title.value.trim(),theater:f_theater.value.trim(),director:f_director.value.trim(),source:f_source.value.trim(),city:f_city.value,category:f_category.value,status:f_status.value,link:f_link.value.trim(),note:f_note.value.trim(),review:f_review.value.trim(),companion:f_companion.value.trim(),seat:f_seat.value.trim(),performance_date:f_date.value||null,performance_time:f_time.value.trim(),seen_date:f_seen.value.trim(),heart_color:heartColor,display_order:Math.floor(Date.now()/1000),data:{tags:nt(f_tags.value)}};let{error}=await db.from('performances').upsert(row);if(error){alert(error.message);return}modal.classList.remove('open');await load()}
async function delCard(id){if(!confirm('Удалить карточку?'))return;let{error}=await db.from('performances').delete().eq('id',id);if(error)alert(error.message);else load()}
load();
</script>
</body>
</html>
